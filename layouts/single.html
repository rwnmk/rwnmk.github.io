{{ define "main" }}
<article class="page">
  <div class="stack-sm">
    <a class="back" href="{{ site.Home.RelPermalink }}">← cd ~</a>
    {{ partial "cmdhead.html" (dict "cmd" (printf "cat %s" (partial "file-name.html" .))) }}
  </div>
  <div class="stack-sm">
    <h1 class="page-title">{{ .Title }}</h1>
    {{- with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
