{{ define "main" }}
<article class="page">
  <div class="stack-sm">
    <a class="back" href="{{ site.Home.RelPermalink }}#projects">← cd ~/projects</a>
    {{ partial "cmdhead.html" (dict "cmd" (printf "cat projects/%s/README.md" (path.Base .File.Dir))) }}
  </div>
  <header class="stack-sm">
    <div class="project-top">
      <h1 class="page-title">{{ .Title }}</h1>
      {{- with .Params.status }}
      <span class="badge sq {{ if eq (lower .) "live" }}badge-live{{ else }}badge-wip{{ end }}">{{ . }}</span>
      {{- end }}
    </div>
    {{- with .Params.link }}<a href="{{ . }}">→ {{ $.Params.linkLabel | default "link" }}</a>{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
