<section id="terminal" class="term sq" aria-label="Terminal" data-term hidden>
  <div class="term-head">
    <span data-term-title>guest@{{ site.Params.terminalHost | default "site" }}: ~</span>
    <div class="term-btns">
      <button class="term-x" type="button" aria-label="Close terminal" title="Close terminal" data-term-close>
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="term-body" data-term-body>
    <div data-term-out role="log" aria-live="polite"></div>
    <div class="term-input-row">
      <label for="term-input" data-term-prompt></label>
      <input id="term-input" class="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-term-input>
    </div>
    <div class="term-menu" data-term-menu hidden></div>
  </div>
</section>
